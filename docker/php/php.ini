; Local development overrides
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; CVE-2026-109618 / CVE-2026-109619 (PHP security release 21 Oct 2026):
; stopgap until the image runs PHP 8.5.12+, blocks the confirmed backtrace
; path on 8.5. Harmless to keep afterwards.
fatal_error_backtraces = Off
