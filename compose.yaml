# PayGate local development stack.
# Use the Makefile (`make up`, `make artisan cmd=...`) rather than calling compose directly,
# because it passes your UID/GID so files created in containers stay owned by you.
name: paygate

x-php: &php
    image: paygate-php:dev
    build:
        context: ./docker/php
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    volumes:
        - ./:/app
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy
    restart: unless-stopped

services:
    # Web: serves paygate.local, api.paygate.local and pay.paygate.local.
    # Laravel routes by host name (see bootstrap/app.php).
    app:
        <<: *php
        environment:
            SERVER_NAME: ':80'
        ports:
            - '80:80'

    horizon:
        <<: *php
        command: php artisan horizon
        healthcheck:
            disable: true

    scheduler:
        <<: *php
        command: php artisan schedule:work
        healthcheck:
            disable: true

    # Vite dev server (hot reload). Same image as the app because the Wayfinder
    # plugin runs `php artisan` to regenerate typed routes.
    vite:
        <<: *php
        command: npm run dev
        healthcheck:
            disable: true
        environment:
            VITE_DEV_HOST: paygate.local
        ports:
            - '5173:5173'

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: paygate
            POSTGRES_USER: paygate
            POSTGRES_PASSWORD: secret
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U paygate -d paygate']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    redis:
        image: redis:8-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '8025:8025'
        restart: unless-stopped

    # Database browser: http://localhost:8080 (user paygate / secret, database paygate).
    # Bound to 127.0.0.1 so it is never reachable from the network.
    adminer:
        image: adminer:latest
        volumes:
            - ./docker/adminer/login-servers.php:/var/www/html/plugins-enabled/login-servers.php:ro
        ports:
            - '127.0.0.1:8080:8080'
        depends_on:
            - postgres
        restart: unless-stopped

volumes:
    postgres-data:
    redis-data:
