name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Tests run against real PostgreSQL (the app relies on row locks / SKIP LOCKED).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: paygate_testing
          POSTGRES_USER: paygate
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paygate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: paygate_testing

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, redis, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
